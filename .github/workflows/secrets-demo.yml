name: Secrets demo
on: push

jobs:
  demo:
    runs-on: ubuntu-latest
    steps:
      - name: Try to print the secret
        env:
          PASSWORD: ${{ secrets.MY_PASSWORD }}   # pull from the vault
        run: echo "The password is $PASSWORD"

      - name: Use it without printing it
        env:
          PASSWORD: ${{ secrets.MY_PASSWORD }}
        run: |
          if [ "$PASSWORD" = "banana123" ]; then
            echo "Login would succeed"
          fi
