name: Test my code
on: push
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4        # deliver my code
      - uses: actions/setup-python@v5    # another ready-made action: install Python
        with:
          python-version: "3.12"
      - run: pip install pytest           # my own command: install the test tool
      - run: pytest                       # my own command: run the tests
